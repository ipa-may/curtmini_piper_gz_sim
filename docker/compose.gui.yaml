services:
  gz-sim:
    devices:
      - /dev/dri:/dev/dri
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command:
      - ros2
      - launch
      - curtmini_piper_gz_sim
      - simulation.launch.py
      - gui:=true
      - use_rviz:=false
      - world:=${SIM_WORLD:-curtmini_piper}
      - use_hokuyo:=${SIM_USE_HOKUYO:-true}
      - spawn_x:=${SIM_SPAWN_X:-0.0}
      - spawn_y:=${SIM_SPAWN_Y:--2.0}
      - spawn_z:=${SIM_SPAWN_Z:-0.16}
      - spawn_yaw:=${SIM_SPAWN_YAW:-0.0}
      - arm_mount_xyz:=${ARM_MOUNT_XYZ:-0 0 0.18}
      - arm_mount_rpy:=${ARM_MOUNT_RPY:-0 0 0}
      - tcp_offset_xyz:=${TCP_OFFSET_XYZ:-0 0 0}
      - tcp_offset_rpy:=${TCP_OFFSET_RPY:-0 0 0}
