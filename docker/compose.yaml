x-ros-environment: &ros-environment
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
  RMW_IMPLEMENTATION: rmw_${RMW:-cyclonedds}_cpp

x-build-args: &build-args
  ROS_DISTRO: ${CONTAINER_ROS_DISTRO:-jazzy}
  ROS_IMAGE: ${ROS_IMAGE:-ros:${CONTAINER_ROS_DISTRO:-jazzy}-ros-base-noble}
  RMW: ${RMW:-cyclonedds}
  OCI_SOURCE: ${OCI_SOURCE:-}
  OCI_REVISION: ${OCI_REVISION:-unknown}

services:
  gz-sim:
    profiles: [simulation]
    image: ${IMAGE_PREFIX:-curtmini-piper}-gazebo:${CONTAINER_ROS_DISTRO:-jazzy}-${RMW:-cyclonedds}
    build:
      context: https://github.com/ipa-may/curtmini_piper_gz_sim.git#main
      additional_contexts:
        container_common: ${CONTAINER_INFRA_SOURCE:-../../../../../curtmini_piper_containers}/common
        # Supports simulator main revisions that still COPY from robot_source.
        robot_source: https://github.com/ipa-may/curtmini_piper.git#main
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        <<: *build-args
    network_mode: host
    init: true
    environment:
      <<: *ros-environment
    volumes:
      - type: bind
        source: ../config/initial_state.yaml
        target: /opt/ws/install/share/curtmini_piper_gz_sim/config/initial_state.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../config/apriltags.yaml
        target: /opt/ws/install/share/curtmini_piper_gz_sim/config/apriltags.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CURTMINI_PIPER_DESCRIPTION_CONFIG_DIR:-../../../curtmini_piper/curtmini_piper_description/config}
        target: /opt/ws/install/share/curtmini_piper_description/config
        read_only: true
        bind:
          create_host_path: false
    command:
      - ros2
      - launch
      - curtmini_piper_gz_sim
      - simulation.launch.py
      - arm_model:=${ARM_MODEL:-piper_x}
      - gui:=false
      - use_rviz:=false
      - world:=${SIM_WORLD:-curtmini_piper}
      - use_hokuyo:=${SIM_USE_HOKUYO:-true}
      - use_cameras:=${SIM_USE_CAMERAS:-true}
      - use_apriltags:=${SIM_USE_APRILTAGS:-false}
    stop_grace_period: 20s
